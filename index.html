        :root {
            --bg-color: #f4f7f6;

            --primary: #4a90e2;
            --text-dark: #333;

            --warning: #fff3cd;

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            padding: 20px;

            max-width: 1200px;

        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }

            display: flex;
            gap: 25px;
        }
        .sidebar {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            height: fit-content;

        .news-item {
            padding: 18px;
            border: 2px solid transparent;
            border-bottom: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .news-item:last-child { border-bottom: none; }
        .news-item:hover { background-color: #f8fbff; }
        .news-item.active {
            border-color: var(--primary);
            background-color: #f0f7ff;
            box-shadow: 0 2px 5px rgba(74,144,226,0.15);
        }
        .news-item h4 { margin: 0 0 8px 0; font-size: 15px; color: #111; line-height: 1.3; }
        .news-item p { margin: 0; font-size: 13px; color: var(--text-light); line-height: 1.4; }
        
        .main-content {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .current-news-header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);

            color: var(--warning-text);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary);
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); }
        .card h3 { margin-top: 0; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 12px; font-size: 17px; }
        .card p { font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
        .card strong { color: #222; }
        
        .warning-label {
            background-color: var(--warning);
            color: var(--warning-text);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);

            border-top: 4px solid var(--primary);

    const getPrompt = (newsText) => `
You are an expert AI business analyst. Your task is to analyze the following AI news and adapt its meaning for 6 specific sectors: Bank, FMCG, Charity, Education, Government, Corporate.

NEWS TEXT: "${newsText}"

CRITICAL RULE: Do NOT invent facts. Rely ONLY on the provided news text. If the text lacks sufficient information to assess a specific point for a sector, you MUST explicitly write: "⚠️ Недостатньо даних у новині".

1. meaning: What it means for the sector.
2. tasks: Primary tasks or opportunities.
3. audience: Impact on their audience.
4. risks: Specific risks.
5. tone: Recommended tone of communication.

Respond STRICTLY in valid JSON format exactly like this structure:
{
  "Bank": { "meaning": "...", "tasks": "...", "audience": "...", "risks": "...", "tone": "..." },
  "FMCG": { "meaning": "...", "tasks": "...", "audience": "...", "risks": "...", "tone": "..." },

  "Government": { "meaning": "...", "tasks": "...", "audience": "...", "risks": "...", "tone": "..." },
  "Corporate": { "meaning": "...", "tasks": "...", "audience": "...", "risks": "...", "tone": "..." }
}
Output language: Ukrainian.
`;

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function callGeminiAPI(newsText) {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{ parts: [{ text: getPrompt(newsText) }] }],
                generationConfig: {
                    responseMimeType: "application/json" 
                }
            })
        });

        if (!response.ok) {
            const errorBody = await response.json().catch(() => null);
            const message = errorBody?.error?.message || `HTTP ${response.status}`;
            const error = new Error(message);
            error.status = response.status;
            throw error;
        }

        const data = await response.json();
        if (data.error) {
            const error = new Error(data.error.message);
            error.status = data.error.code;
            throw error;
        }

        const responseText = data.candidates[0].content.parts[0].text;
        return JSON.parse(responseText);
    }

    async function callGeminiWithRetry(newsText, maxRetries = 3) {
        const retryStatusEl = document.getElementById('retryStatus');
        let delay = 1500;

        for (let attempt = 0; attempt <= maxRetries; attempt++) {
            try {
                if (retryStatusEl) retryStatusEl.innerText = '';
                return await callGeminiAPI(newsText);
            } catch (error) {
                const isOverloaded = error.status === 503;
                const isLastAttempt = attempt === maxRetries;

                if (!isOverloaded || isLastAttempt) {
                    throw error; 
                }

                if (retryStatusEl) {
                    retryStatusEl.innerText = `Модель перевантажена, повторна спроба ${attempt + 1}/${maxRetries}...`;
                }
                await sleep(delay);
                delay *= 2; 
            }
        }
    }

            document.getElementById('demoBadge').style.display = 'block';
            
            const fallbackData = MOCK_API_RESPONSES[selectedNews.id];
            
            await sleep(800); 
            renderResults(fallbackData);
            
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    const sectorNames = {
        "Bank": "🏦 Банківський сектор",
        "FMCG": "🛒 FMCG компанії",
        "Charity": "❤️ Благодійні фонди",
        "Education": "🎓 Освітні проєкти",
        "Government": "🏛 Державні інституції",
        "Corporate": "🏢 Корпоративні комунікації"
    };

    function renderResults(data) {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        for (const [sector, info] of Object.entries(data)) {
            const card = document.createElement('div');
            card.className = 'card';
            
            let cardContent = `<h3>${sectorNames[sector]}</h3>`;
            
            const fields = [
                { key: 'meaning', label: 'Специфіка' },
                { key: 'tasks', label: 'Задачі' },
                { key: 'audience', label: 'Аудиторія' },
                { key: 'risks', label: 'Ризики' },
                { key: 'tone', label: 'Тон комунікації' }
            ];

            fields.forEach(field => {
                const text = info[field.key];
                if (text.includes('⚠️')) {
                    cardContent += `<p><strong>${field.label}:</strong> <span class="warning-label">${text}</span></p>`;
                } else {
                    cardContent += `<p><strong>${field.label}:</strong> ${text}</p>`;
                }
            });

            card.innerHTML = cardContent;
            container.appendChild(card);
        }
    }

    renderNews();
</script>

</body>
</html>
